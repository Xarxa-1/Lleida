name: Actualitzar Playlist M3U

on:
  schedule:
    # Executa cada dia a les 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet executar-ho manualment des de GitHub

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar el codi del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal·lar dependències i Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Executar l'script de captura
        run: python capture_m3u8.py

      - name: Desar i fer push dels canvis a GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          git diff-index --quiet HEAD || git commit -m "Auto-update: playlist.m3u"
          git push
